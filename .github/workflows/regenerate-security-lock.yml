name: Regenerar lock de seguridad

on:
  push:
    branches:
      - agent/sec-00-dependency-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sec-00-dependency-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Validate clean install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Commit regenerated lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya está actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): actualizar package-lock [skip ci]"
          git push origin HEAD:agent/sec-00-dependency-audit
